version: '3.8'

services:
  exhibition-dashboard:
    build: .
    ports:
      - "8456:80"
    container_name: exhibition-progress-wall
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
